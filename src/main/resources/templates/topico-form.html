<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title
        th:text="${modoEdicao} ? 'Editar tópico - StudyFlow' : 'Novo tópico - StudyFlow'"
    >
        Tópico - StudyFlow
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            StudyFlow
        </a>

        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">
                Dashboard
            </a>

            <a class="nav-link active" th:href="@{/preparacoes}">
                Preparações
            </a>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <a
                        class="text-decoration-none small"
                        th:href="@{/preparacoes/{id}(id=${preparacao.id})}"
                    >
                        ← Voltar para a preparação
                    </a>

                    <h1
                        class="mt-2 mb-1"
                        th:text="${modoEdicao} ? 'Editar tópico' : 'Novo tópico'"
                    >
                        Tópico
                    </h1>

                    <p class="text-muted mb-0">
                        Preparação:
                        <strong th:text="${preparacao.nome}">
                            Nome da preparação
                        </strong>
                    </p>

                    <p class="text-muted mb-0">
                        Disciplina:
                        <strong th:text="${disciplina.nome}">
                            Nome da disciplina
                        </strong>
                    </p>
                </div>

                <a
                    class="btn btn-outline-secondary"
                    th:href="@{/preparacoes/{id}(id=${preparacao.id})}"
                >
                    Cancelar
                </a>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form
                        th:action="${modoEdicao}
                            ? @{/topicos/{id}/editar(id=${topico.id})}
                            : @{/disciplinas/{id}/topicos(id=${disciplina.id})}"
                        th:object="${topico}"
                        method="post"
                    >
                        <input
                            type="hidden"
                            th:field="*{preparacaoId}"
                        >

                        <input
                            type="hidden"
                            th:field="*{disciplinaId}"
                        >

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="nome" class="form-label">
                                    Nome do tópico
                                </label>

                                <input
                                    id="nome"
                                    type="text"
                                    class="form-control"
                                    th:field="*{nome}"
                                    placeholder="Ex.: Equações do 2º grau"
                                    maxlength="150"
                                    required
                                >
                            </div>

                            <div class="col-md-4">
                                <label for="peso" class="form-label">
                                    Peso
                                </label>

                                <input
                                    id="peso"
                                    type="number"
                                    class="form-control"
                                    th:field="*{peso}"
                                    min="1"
                                    max="10"
                                    placeholder="Ex.: 3"
                                    required
                                >

                                <div class="form-text">
                                    Use de 1 a 10 conforme a importância do tópico.
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label for="status" class="form-label">
                                    Status
                                </label>

                                <select
                                    id="status"
                                    class="form-select"
                                    th:field="*{status}"
                                    required
                                >
                                    <option
                                        th:each="status : ${statusTopico}"
                                        th:value="${status}"
                                        th:text="${status}"
                                    >
                                        PENDENTE
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a
                                class="btn btn-outline-secondary"
                                th:href="@{/preparacoes/{id}(id=${preparacao.id})}"
                            >
                                Cancelar
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                                th:text="${modoEdicao}
                                    ? 'Salvar alterações'
                                    : 'Salvar tópico'"
                            >
                                Salvar tópico
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<footer class="container py-4 text-center text-muted">
    <hr>
    <small>StudyFlow © 2026</small>
</footer>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
