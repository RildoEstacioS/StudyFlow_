<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Registrar desempenho - StudyFlow</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>


<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            StudyFlow
        </a>

        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">
                Dashboard
            </a>

            <a class="nav-link active" th:href="@{/preparacoes}">
                Preparações
            </a>
        </div>
    </div>
</nav>


<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <a
                        class="text-decoration-none small"
                        th:href="@{/preparacoes/{id}(id=${preparacao.id})}"
                    >
                        ← Voltar para a preparação
                    </a>

                    <h1 class="mt-2 mb-1">
                        Registrar desempenho
                    </h1>

                    <p class="text-muted mb-0">
                        Preparação:
                        <strong th:text="${preparacao.nome}">
                            Nome da preparação
                        </strong>
                    </p>

                    <p class="text-muted mb-0">
                        Disciplina:
                        <strong th:text="${disciplina.nome}">
                            Nome da disciplina
                        </strong>
                    </p>

                    <p class="text-muted mb-0">
                        Tópico:
                        <strong th:text="${topico.nome}">
                            Nome do tópico
                        </strong>
                    </p>
                </div>

                <a
                    class="btn btn-outline-secondary"
                    th:href="@{/preparacoes/{id}(id=${preparacao.id})}"
                >
                    Cancelar
                </a>
            </div>


            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form
                        th:action="@{/topicos/{id}/desempenho(id=${topico.id})}"
                        method="post"
                    >
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="questoesRespondidas" class="form-label">
                                    Questões respondidas
                                </label>

                                <input
                                    id="questoesRespondidas"
                                    type="number"
                                    class="form-control"
                                    name="questoesRespondidas"
                                    th:value="${questoesRespondidas}"
                                    min="1"
                                    placeholder="Ex.: 30"
                                    required
                                >
                            </div>

                            <div class="col-md-6">
                                <label for="acertos" class="form-label">
                                    Acertos
                                </label>

                                <input
                                    id="acertos"
                                    type="number"
                                    class="form-control"
                                    name="acertos"
                                    th:value="${acertos != null ? acertos : 0}"
                                    min="0"
                                    placeholder="Ex.: 21"
                                    required
                                >

                                <div class="form-text">
                                    O percentual será calculado automaticamente.
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a
                                class="btn btn-outline-secondary"
                                th:href="@{/preparacoes/{id}(id=${preparacao.id})}"
                            >
                                Cancelar
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Salvar desempenho
                            </button>
                        </div>
                    </form>
                </div>
            </div>


        </div>
    </div>
</main>


<footer class="container py-4 text-center text-muted">
    <hr>
    <small>StudyFlow © 2026</small>
</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>
</html>
