<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Excluir Preparação - StudyFlow</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            StudyFlow
        </a>

        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">
                Dashboard
            </a>

            <a class="nav-link active" th:href="@{/preparacoes}">
                Preparações
            </a>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <h2 class="h4 mb-3">Confirmar exclusão</h2>

                    <p class="text-muted mb-4">
                        Tem certeza que deseja excluir a preparação
                        <strong th:text="${preparacao.nome}">Nome</strong>?
                    </p>

                    <div class="alert alert-warning" role="alert">
                        Esta ação não pode ser desfeita!
                    </div>

                    <form th:action="@{/preparacoes/{id}/excluir(id=${preparacao.id})}" method="post">
                        <div class="d-flex justify-content-center gap-2">
                            <a
                                th:href="@{/preparacoes}"
                                class="btn btn-outline-secondary"
                            >
                                Cancelar
                            </a>

                            <button type="submit" class="btn btn-danger">
                                Excluir
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-4 text-center text-muted">
    <hr>
    <small>StudyFlow © 2026</small>
</footer>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
